<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureOneへの道のり - 道順案内システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* スキップリンク */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 0;
            background: #2c3e50;
            color: #ffffff;
            padding: 12px 24px;
            z-index: 200;
            font-size: 1em;
            text-decoration: none;
            border-radius: 0 0 8px 0;
        }

        .skip-link:focus {
            top: 0;
        }

        /* フォーカスインジケーター (WCAG 2.4.7, 2.4.11, 2.4.12) */
        :focus-visible {
            outline: 3px solid #1a5276;
            outline-offset: 2px;
        }

        .btn:focus-visible,
        .floating-btn:focus-visible {
            outline: 3px solid #1a5276;
            outline-offset: 3px;
            box-shadow: 0 0 0 6px rgba(26, 82, 118, 0.3);
        }

        /* スクリーンリーダー専用テキスト */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ライブリージョン */
        .live-region {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #595959;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .navigation-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .step-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .step-number {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            flex-shrink: 0;
        }

        .step-image {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #ecf0f1;
            transition: transform 0.3s ease, opacity 0.3s ease;
            background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0),
                        linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .step-image:hover {
            transform: scale(1.05);
        }

        .step-image.loading {
            opacity: 0.6;
        }

        .step-image.loaded {
            opacity: 1;
        }

        .image-placeholder {
            width: 200px;
            height: 150px;
            border-radius: 10px;
            border: 3px solid #ecf0f1;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 0.9em;
            text-align: center;
            position: relative;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .image-info {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7em;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            color: #2c3e50;
            font-size: 1.4em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .step-description {
            color: #4a4a4a;
            line-height: 1.6;
            font-size: 1.1em;
        }

        .progress-bar {
            background: #ecf0f1;
            height: 8px;
            border-radius: 4px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .floating-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .floating-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-btn-up {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .floating-btn-down {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }

        .floating-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sticky-controls {
            position: sticky;
            top: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(149, 165, 166, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .current-step {
            border: 3px solid #3498db;
            background: linear-gradient(135deg, #ebf3fd, #d6eaff);
        }

        .completed-step {
            opacity: 0.7;
            background: linear-gradient(135deg, #d5f4e6, #c8e6c9);
        }

        .info-panel {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            border-left: 5px solid #3498db;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
        }

        .modal-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }

        .close-modal:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }

        /* prefers-reduced-motion対応 (WCAG 2.3.3) */
        @media (prefers-reduced-motion: reduce) {
            .step-container,
            .step-image,
            .btn,
            .floating-btn,
            .progress-fill {
                transition: none;
            }

            .step-container:hover {
                transform: none;
            }

            .loading-spinner {
                animation: none;
            }
        }

        @media (max-width: 768px) {
            .step-container {
                flex-direction: column;
                text-align: center;
            }

            .step-image {
                width: 100%;
                max-width: 300px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 200px;
            }

            .floating-controls {
                bottom: 20px;
                right: 20px;
                gap: 10px;
            }

            .floating-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }

            .sticky-controls {
                padding: 10px;
                margin-bottom: 15px;
            }

            .sticky-controls .btn {
                width: 140px;
                padding: 8px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <a href="#navigationContainer" class="skip-link">メインコンテンツへスキップ</a>

    <!-- ライブリージョン: ステップ変更通知 -->
    <div id="liveRegion" class="live-region" aria-live="polite" aria-atomic="true"></div>

    <div class="container" role="document">
        <header class="header">
            <h1>🗺️ FutureOneへの道のり</h1>
            <p class="subtitle">画像で案内する道順ナビゲーションシステム</p>
        </header>

        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="ナビゲーション進捗">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Sticky controls at the top -->
        <nav class="sticky-controls" aria-label="ステップ操作">
            <div class="controls">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousStep()" aria-label="前のステップへ戻る">⬅️ 前のステップ</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" aria-label="次のステップへ進む">次のステップ ➡️</button>
            </div>
        </nav>

        <main id="navigationContainer" class="navigation-container" aria-label="道順ステップ一覧">
            <!-- Steps will be dynamically generated here -->
        </main>

        <!-- Floating controls -->
        <nav class="floating-controls" aria-label="フローティングナビゲーション">
            <button class="floating-btn floating-btn-up" id="floatingPrevBtn" onclick="previousStep()" aria-label="前のステップへ戻る" title="前のステップ">⬅️</button>
            <button class="floating-btn floating-btn-down" id="floatingNextBtn" onclick="nextStep()" aria-label="次のステップへ進む" title="次のステップ">➡️</button>
        </nav>

        <section class="info-panel" aria-labelledby="usageHeading">
            <h2 id="usageHeading">🔍 使い方</h2>
            <ul>
                <li>各ステップの画像をクリックまたはEnterキーで拡大表示されます</li>
                <li>「次のステップ」「前のステップ」ボタンで進行状況を管理できます</li>
                <li>現在のステップは青い枠で強調表示されます</li>
                <li>キーボードの左右矢印キーでもステップ移動できます</li>
            </ul>
        </section>
    </div>

    <!-- Modal for image zoom -->
    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="画像の拡大表示" onclick="handleModalBackdropClick(event)">
        <button class="close-modal" id="closeModalBtn" onclick="closeModal()" aria-label="拡大画像を閉じる">&times;</button>
        <div class="modal-content">
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>

    <script>
        // Route data - with thumbnail and full image paths for optimization
        const routeSteps = [
            {
                image: "img/250717132230341.JPG",
                thumbnail: "img/thumbnails/250717132230341.JPG",
                title: "出発地点",
                description: "こちらが出発地点です。大崎駅南改札口からスタートします。ここから道順を進めていきましょう。"
            },
            {
                image: "img/250717132246343.JPG",
                thumbnail: "img/thumbnails/250717132246343.JPG",
                title: "第1チェックポイント",
                description: "最初の曲がり角です。新西口方面に進んでください。この地点を過ぎると、次のポイントへ向かいます。"
            },
            {
                image: "img/250717132321016.JPG",
                thumbnail: "img/thumbnails/250717132321016.JPG",
                title: "第2チェックポイント", 
                description: "正面にThinkPark Towerが見えます。 このビルの前を左に曲がります。"
            },
            {
                image: "img/250717132440700.JPG",
                thumbnail: "img/thumbnails/250717132440700.JPG",
                title: "中間地点",
                description: "正面にSonyビルが見えます。このビルの手前を右に曲がります。"
            },
            {
                image: "img/250717132457273.JPG",
                thumbnail: "img/thumbnails/250717132457273.JPG",
                title: "第3チェックポイント",
                description: "もうすぐ目的地が近づいています。この景色が見えたら正しいルートを進んでいます。角を左に曲がってください"
            },
            {
                image: "img/250717132546917.JPG",
                thumbnail: "img/thumbnails/250717132546917.JPG",
                title: "最終チェックポイント",
                description: "最後のチェックポイントです。目的地はもう間近です。右に曲がってください"
            },
            {
                image: "img/250717132621391.JPG",
                thumbnail: "img/thumbnails/250717132621391.JPG",
                title: "目的地到着",
                description: "お疲れ様でした！目的地に到着しました。この景色で到着を確認してください。"
            }
        ];

        let currentStep = 0;
        let imageCache = new Map();
        let loadedImages = new Set();

        // Image lazy loading and caching system with thumbnail support
        function createImageElement(thumbnailSrc, fullSrc, alt, onClick) {
            const container = document.createElement('div');
            container.style.position = 'relative';
            container.style.display = 'inline-block';

            // Create placeholder
            const placeholder = document.createElement('div');
            placeholder.className = 'image-placeholder';
            placeholder.innerHTML = `
                <div>
                    <div class="loading-spinner"></div>
                    画像読み込み中...
                </div>
            `;

            // Create actual image (hidden initially) - using thumbnail for display
            const img = document.createElement('img');
            img.className = 'step-image loading';
            img.alt = alt;
            img.style.display = 'none';
            img.onclick = onClick;
            img.setAttribute('tabindex', '0');
            img.setAttribute('role', 'button');
            img.setAttribute('aria-label', alt + 'の画像を拡大表示');
            img.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    onClick();
                }
            });

            // Add image info overlay
            const imageInfo = document.createElement('div');
            imageInfo.className = 'image-info';
            imageInfo.textContent = 'タップで拡大';

            container.appendChild(placeholder);
            container.appendChild(img);
            container.appendChild(imageInfo);

            // Load thumbnail with caching (much faster due to smaller size)
            loadImageWithCache(thumbnailSrc).then(imageUrl => {
                img.src = imageUrl;
                img.onload = () => {
                    img.style.display = 'block';
                    img.classList.remove('loading');
                    img.classList.add('loaded');
                    placeholder.style.display = 'none';
                    loadedImages.add(thumbnailSrc);
                };
            }).catch(error => {
                console.error('Failed to load thumbnail:', thumbnailSrc, error);
                placeholder.innerHTML = `
                    <div style="color: #e74c3c;">
                        <div>⚠️</div>
                        画像の読み込みに失敗しました
                    </div>
                `;
            });

            return container;
        }

        // Image caching system
        function loadImageWithCache(src) {
            return new Promise((resolve, reject) => {
                // Check if image is already cached
                if (imageCache.has(src)) {
                    resolve(imageCache.get(src));
                    return;
                }

                // Create new image object for loading
                const img = new Image();
                img.onload = () => {
                    // Create object URL for caching
                    fetch(src)
                        .then(response => response.blob())
                        .then(blob => {
                            const objectUrl = URL.createObjectURL(blob);
                            imageCache.set(src, objectUrl);
                            resolve(objectUrl);
                        })
                        .catch(() => {
                            // Fallback to original src if blob creation fails
                            imageCache.set(src, src);
                            resolve(src);
                        });
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        // Preload next thumbnail images
        function preloadAdjacentImages() {
            const preloadRange = 2; // Preload 2 images ahead and behind
            const startIndex = Math.max(0, currentStep - preloadRange);
            const endIndex = Math.min(routeSteps.length - 1, currentStep + preloadRange);

            for (let i = startIndex; i <= endIndex; i++) {
                // Preload thumbnails first (fast due to small size)
                if (!loadedImages.has(routeSteps[i].thumbnail)) {
                    loadImageWithCache(routeSteps[i].thumbnail);
                }
                // Also preload full images for modal (slower but improves modal experience)
                if (!loadedImages.has(routeSteps[i].image)) {
                    loadImageWithCache(routeSteps[i].image);
                }
            }
        }

        function initializeNavigation() {
            const container = document.getElementById('navigationContainer');
            container.innerHTML = '';

            routeSteps.forEach((step, index) => {
                const stepElement = document.createElement('div');
                stepElement.className = 'step-container';
                stepElement.id = `step-${index}`;
                
                // Create step content
                stepElement.setAttribute('role', 'article');
                stepElement.setAttribute('aria-label', `ステップ ${index + 1}: ${step.title}`);

                const stepNumber = document.createElement('div');
                stepNumber.className = 'step-number';
                stepNumber.setAttribute('aria-hidden', 'true');
                stepNumber.textContent = index + 1;

                // Create image with lazy loading - using thumbnail for display, full image for modal
                const imageContainer = createImageElement(
                    step.thumbnail,  // Use thumbnail for display (fast loading)
                    step.image,      // Keep reference to full image for modal
                    step.title, 
                    () => openModal(step.image)  // Modal uses full image
                );

                const stepContent = document.createElement('div');
                stepContent.className = 'step-content';
                stepContent.innerHTML = `
                    <h2 class="step-title">${step.title}</h2>
                    <p class="step-description">${step.description}</p>
                `;

                stepElement.appendChild(stepNumber);
                stepElement.appendChild(imageContainer);
                stepElement.appendChild(stepContent);
                
                container.appendChild(stepElement);
            });

            updateStepDisplay();
            
            // Start preloading adjacent images
            preloadAdjacentImages();
        }

        function updateStepDisplay() {
            const steps = document.querySelectorAll('.step-container');
            
            steps.forEach((step, index) => {
                step.classList.remove('current-step', 'completed-step');
                
                if (index < currentStep) {
                    step.classList.add('completed-step');
                } else if (index === currentStep) {
                    step.classList.add('current-step');
                }
            });

            // Update progress bar
            const progress = ((currentStep + 1) / routeSteps.length) * 100;
            const progressBar = document.getElementById('progressFill').parentElement;
            document.getElementById('progressFill').style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', Math.round(progress));

            // ライブリージョンでステップ変更を通知
            const liveRegion = document.getElementById('liveRegion');
            if (liveRegion) {
                liveRegion.textContent = `ステップ ${currentStep + 1}/${routeSteps.length}: ${routeSteps[currentStep].title}`;
            }

            // Update both sets of button states
            const prevButtons = ['prevBtn', 'floatingPrevBtn'];
            const nextButtons = ['nextBtn', 'floatingNextBtn'];
            
            prevButtons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                if (btn) btn.disabled = currentStep === 0;
            });
            
            nextButtons.forEach(btnId => {
                const btn = document.getElementById(btnId);
                if (btn) btn.disabled = currentStep === routeSteps.length - 1;
            });

            // Scroll to current step
            const currentStepElement = document.getElementById(`step-${currentStep}`);
            if (currentStepElement) {
                currentStepElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Preload adjacent images when step changes
            preloadAdjacentImages();
        }

        function nextStep() {
            if (currentStep < routeSteps.length - 1) {
                currentStep++;
                updateStepDisplay();
            }
        }

        function previousStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }

        let lastFocusedElement = null;

        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            
            // フォーカス復帰のために現在のフォーカス要素を保存
            lastFocusedElement = document.activeElement;

            // モーダル画像のaltテキストを設定
            const currentStepData = routeSteps[currentStep];
            modalImage.alt = currentStepData ? `${currentStepData.title}の拡大画像` : '拡大画像';

            // Always use full-size image for modal, load if not cached
            loadImageWithCache(imageSrc).then(cachedSrc => {
                modalImage.src = cachedSrc;
                modal.style.display = 'block';
                // モーダルが開いたら閉じるボタンにフォーカス
                document.getElementById('closeModalBtn').focus();
                // 背景のスクロールを無効化
                document.body.style.overflow = 'hidden';
            }).catch(error => {
                console.error('Failed to load full-size image for modal:', imageSrc, error);
                modalImage.src = imageSrc;
                modal.style.display = 'block';
                document.getElementById('closeModalBtn').focus();
                document.body.style.overflow = 'hidden';
            });
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
            document.body.style.overflow = '';
            // フォーカスを元の要素に戻す
            if (lastFocusedElement) {
                lastFocusedElement.focus();
                lastFocusedElement = null;
            }
        }

        function handleModalBackdropClick(event) {
            if (event.target === event.currentTarget) {
                closeModal();
            }
        }

        // モーダル内のフォーカストラップ (WCAG 2.4.3)
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('imageModal');
            if (modal.style.display !== 'block') return;

            if (event.key === 'Tab') {
                const closeBtn = document.getElementById('closeModalBtn');
                const modalImage = document.getElementById('modalImage');
                const focusableElements = [closeBtn, modalImage];
                const firstElement = focusableElements[0];
                const lastElement = focusableElements[focusableElements.length - 1];

                if (event.shiftKey) {
                    if (document.activeElement === firstElement) {
                        event.preventDefault();
                        lastElement.focus();
                    }
                } else {
                    if (document.activeElement === lastElement) {
                        event.preventDefault();
                        firstElement.focus();
                    }
                }
            }
        });

        // Cleanup function for memory management
        function cleanupImageCache() {
            // Keep only recently used images in cache
            const maxCacheSize = 10;
            if (imageCache.size > maxCacheSize) {
                const entries = Array.from(imageCache.entries());
                const oldEntries = entries.slice(0, entries.length - maxCacheSize);
                oldEntries.forEach(([key, value]) => {
                    if (value.startsWith('blob:')) {
                        URL.revokeObjectURL(value);
                    }
                    imageCache.delete(key);
                });
            }
        }

        // Keyboard navigation (モーダルが閉じている時のみ)
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('imageModal');
            if (modal.style.display === 'block') {
                // モーダル内ではEscapeのみ処理
                if (event.key === 'Escape') {
                    closeModal();
                }
                return;
            }

            if (event.key === 'ArrowRight') {
                event.preventDefault();
                nextStep();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                previousStep();
            } else if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize the navigation system when page loads
        window.onload = initializeNavigation;

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            imageCache.forEach((value, key) => {
                if (value.startsWith('blob:')) {
                    URL.revokeObjectURL(value);
                }
            });
        });

        // Periodic cleanup
        setInterval(cleanupImageCache, 60000); // Cleanup every minute
    </script>
</body>
</html>
